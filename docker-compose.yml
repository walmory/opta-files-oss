# PDF processing engine: Stirling-PDF (https://github.com/Stirling-Tools/Stirling-PDF),
# pulled as a Docker image — it is not part of this repository and keeps its own license.
# It only listens on localhost; the browser talks to the Opta Files backend, never to it.
services:
  pdf_engine:
    image: docker.stirlingpdf.com/stirlingtools/stirling-pdf:latest
    container_name: opta_files_engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      SECURITY_ENABLELOGIN: "false"
      LANGS: "pt_BR,en_GB"
      SYSTEM_MAXFILESIZE: "200"
      SYSTEM_SHOWUPDATE: "false"
      SYSTEM_ENABLEANALYTICS: "false"
      UI_APPNAME: "Opta Files"
      UI_HOMEDESCRIPTION: "Opta Files"
      UI_APPNAMENAVBAR: "Opta Files"
    volumes:
      - engine_configs:/configs
      - engine_tessdata:/usr/share/tessdata
      - engine_logs:/logs

volumes:
  engine_configs:
  engine_tessdata:
  engine_logs:
